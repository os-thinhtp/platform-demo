services:
  mysql:
    image: mysql:8.4
    container_name: platform-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.0
    container_name: platform-keycloak
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  platform-api:
    build:
      context: ./platform-api
    container_name: platform-api
    environment:
      DB_URL: jdbc:mysql://mysql:3306/platform_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/platform-demo
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8081:8081"

  business-a-service:
    build:
      context: ./business-a-service
    container_name: business-a-service
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/platform-demo
      BUSINESS_A_CLIENT_SECRET: business-a-secret
    depends_on:
      keycloak:
        condition: service_started
    ports:
      - "8082:8082"

  business-b-service:
    build:
      context: ./business-b-service
    container_name: business-b-service
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/platform-demo
      BUSINESS_B_CLIENT_SECRET: business-b-secret
    depends_on:
      keycloak:
        condition: service_started
    ports:
      - "8083:8083"

  gateway:
    build:
      context: ./gateway
    container_name: platform-gateway
    environment:
      PLATFORM_API_URI: http://platform-api:8081
      BUSINESS_A_URI: http://business-a-service:8082
      BUSINESS_B_URI: http://business-b-service:8083
    depends_on:
      platform-api:
        condition: service_started
      business-a-service:
        condition: service_started
      business-b-service:
        condition: service_started
    ports:
      - "8084:8084"

  platform-ui:
    build:
      context: ./platform-ui
    container_name: platform-ui
    depends_on:
      gateway:
        condition: service_started
    ports:
      - "4200:80"
